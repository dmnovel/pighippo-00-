<script id="event-theme-bootstrap">
(()=>{
  const THEME_KEY='dm_theme_preference';
  const mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
  function getPref(){
    try{
      const v=localStorage.getItem(THEME_KEY);
      return (v==='light'||v==='dark'||v==='system'||v==='colorblind') ? v : 'system';
    }catch(e){ return 'system'; }
  }
  function applyTheme(){
    const pref=getPref();
    const effective=pref==='system'?((mq&&mq.matches)?'dark':'light'):pref;
    const root=document.documentElement;
    root.dataset.theme=effective;
    root.dataset.themePreference=pref;
    root.style.colorScheme=effective==='dark'?'dark':'light';
    const meta=document.querySelector('meta[name="theme-color"]');
    if(meta)meta.setAttribute('content',effective==='dark'?'#18181B':effective==='colorblind'?'#F7F8FA':'#F7F7F8');
  }
  applyTheme();
  document.addEventListener('DOMContentLoaded',applyTheme,{once:true});
  window.addEventListener('pageshow',applyTheme);
  window.addEventListener('focus',applyTheme);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)applyTheme()});
  window.addEventListener('storage',e=>{if(e.key===THEME_KEY)applyTheme()});
  if(mq){
    const onChange=()=>{if(getPref()==='system')applyTheme()};
    if(mq.addEventListener)mq.addEventListener('change',onChange);
    else if(mq.addListener)mq.addListener(onChange);
  }
})();
</script>

    btn.textContent=collapsed?'장바구니 열기 ◀':'접기 ▶';
    btn.setAttribute('aria-expanded',collapsed?'false':'true');
    btn.setAttribute('aria-label',collapsed?'장바구니 열기':'장바구니 접기');
    btn.title=collapsed?'장바구니 열기':'장바구니 접기';
  }
  btn.addEventListener('click',function(){
    dock.classList.toggle('is-collapsed');
    sync();
  });
  sync();
})();
</script>

<script id="recent-viewed-works-script">
(function(){
  const KEY='dm_recent_viewed_works_v1';
  const LIMIT=30;
  const norm=v=>String(v||'').trim().toLowerCase().replace(/\s+/g,'');
  const cleanHref=v=>{try{const u=new URL(String(v||''),location.href);return (u.origin+u.pathname).replace(/\/$/,'')}catch{return String(v||'').split('?')[0].replace(/\/$/,'')}};
  function identity(item){
    const ta=norm(item?.title)+'|'+norm(item?.author);
    if(ta!=='|')return 'ta:'+ta;
    const href=cleanHref(item?.href);if(href)return 'href:'+href;
    const wid=norm(item?.workId);if(wid)return 'id:'+wid;
    return 'key:'+norm(item?.key);
  }
  function dedupe(raw){
    const arr=Array.isArray(raw)?raw:[];const seen=new Set();const out=[];
    for(const item of arr){if(!item||typeof item!=='object')continue;const id=identity(item);if(!id||seen.has(id))continue;seen.add(id);out.push(item);if(out.length>=LIMIT)break}
    return out;
  }
  const getItems=()=>{try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');const d=dedupe(v);if(JSON.stringify(d)!==JSON.stringify(v))localStorage.setItem(KEY,JSON.stringify(d));return d}catch{return []}};
  const saveItems=v=>{try{localStorage.setItem(KEY,JSON.stringify(dedupe(v).slice(0,LIMIT)))}catch{}};
  function rememberFromCard(card,linkEl){
    if(!card)return;
    const title=String(card.querySelector('.book-title')?.textContent||'').trim();
    const author=String(card.querySelector('.book-meta')?.textContent||'').trim();
    const href=String(linkEl?.href||card.querySelector('.book-title[href]')?.href||card.querySelector('.book-cover[href]')?.href||'').trim();
    const workId=String(card.dataset.workId||'').trim();
    if(!title)return;
    const fresh={key:workId||href||(title+'|'+author),workId,title,author,href,seenAt:Date.now()};
    const fid=identity(fresh);const items=getItems().filter(x=>identity(x)!==fid);items.unshift(fresh);saveItems(items);
  }
  function render(){
    const list=document.getElementById('recentViewedList');if(!list)return;
    list.innerHTML='';const items=getItems();
    if(!items.length){const empty=document.createElement('div');empty.className='recent-viewed-empty';empty.textContent='최근 본 작품이 없습니다.';list.appendChild(empty);return}
    items.forEach(item=>{const el=document.createElement(item.href?'a':'div');el.className='recent-viewed-item';if(item.href){el.href=item.href;el.target='_blank';el.rel='noopener noreferrer'}const title=document.createElement('span');title.className='recent-viewed-title';title.textContent=item.title||'(제목 없음)';const author=document.createElement('span');author.className='recent-viewed-author';author.textContent=item.author||'작가 정보 없음';el.append(title,author);list.appendChild(el)});
  }
  function open(){const b=document.getElementById('recentViewedBackdrop');if(!b)return;render();b.classList.add('open');b.setAttribute('aria-hidden','false');document.body.classList.add('modal-open')}
  function close(){const b=document.getElementById('recentViewedBackdrop');if(!b)return;b.classList.remove('open');b.setAttribute('aria-hidden','true');document.body.classList.remove('modal-open')}
  getItems();
  document.addEventListener('click',function(e){
    const link=e.target.closest?.('.book-title[href],.book-cover[href]');if(link)rememberFromCard(link.closest('.card'),link);
    const action=e.target.closest?.('.history-btn,.favorite-toggle,.favorite-action-btn,.cart-btn');if(action&&!action.disabled&&!action.classList.contains('disabled'))rememberFromCard(action.closest('.card'),null);
    const remove=e.target.closest?.('.remove-btn[data-remove-id]');if(remove){const row=remove.closest?.('.cart-item');if(row){const title=String(row.querySelector('.cart-item-title')?.textContent||'').trim();const meta=String(row.querySelector('.cart-item-meta')?.textContent||'').trim();const author=meta.split('·')[0].trim();const rawKey=String(remove.getAttribute('data-remove-id')||'').trim();if(title){const href=/^https?:\/\//i.test(rawKey)?rawKey:'';const workId=href?'':rawKey;const fresh={key:rawKey||(title+'|'+author),workId,title,author,href,seenAt:Date.now()};const fid=identity(fresh);const items=getItems().filter(x=>identity(x)!==fid);items.unshift(fresh);saveItems(items)}}}
    const trigger=e.target.closest?.('[data-open-recent-viewed]');if(trigger){e.preventDefault();const menu=document.getElementById('mobileMenuBackdrop');if(menu){menu.classList.remove('open');menu.setAttribute('aria-hidden','true')}open()}
  },true);
  document.getElementById('recentViewedClose')?.addEventListener('click',close);
  document.getElementById('recentViewedBackdrop')?.addEventListener('click',e=>{if(e.target.id==='recentViewedBackdrop')close()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
})();
</script>
